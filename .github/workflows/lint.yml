name: Lint

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values for the import check: tcbot validates presence and
      # shape at import time but never connects, so no real secrets are
      # needed (and fork PRs have no secrets to inject).
      BOT_TOKEN: "000000:dummy-token-for-lint"
      MONGODB_URI: "mongodb://localhost:27017"
      OWNER_ID: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check lint
        run: uv run ruff check .

      - name: Import check
        run: uv run python -c "import tcbot; print('import OK')"
